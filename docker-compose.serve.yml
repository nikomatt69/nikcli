services:
  nikcli-serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "4096:4096"
    environment:
      - NIKCLI_SERVER_PASSWORD=dev123
      - PORT=4096
      # Auto-detect LAN IP — the phone on WiFi needs this to connect
      - HOST_IP=${HOST_IP}
    volumes:
      - nikcli-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/global/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nikcli-data:
