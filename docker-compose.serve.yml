services:
  nikcli-serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "4096:4096"
      - "2222:2222"
    env_file:
      - packages/slack/.env
    environment:
      - NIKCLI_SERVER_SSH_ENABLED=true
      - NIKCLI_SERVER_TAILSCALE_AUTH=${NIKCLI_SERVER_TAILSCALE_AUTH:-false}
    volumes:
      - nikcli-data:/app/.nikcli
      - /Users/nikoemme/.local/share/nikcli/auth.json:/root/.local/share/nikcli/auth.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  slack-bot:
    build:
      context: .
      dockerfile: packages/slack/Dockerfile
    env_file:
      - packages/slack/.env
    environment:
      # Always points to the nikcli-serve container on the internal Docker network
      - NIKCLI_URL=http://nikcli-serve:4096
    depends_on:
      nikcli-serve:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  nikcli-data:
