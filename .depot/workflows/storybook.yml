name: storybook

on:
  push:
    branches: [live-main]
    paths:
      - ".github/workflows/storybook.yml"
      - ".depot/workflows/storybook.yml"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
  pull_request:
    branches: [live-main]
    paths:
      - ".github/workflows/storybook.yml"
      - ".depot/workflows/storybook.yml"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: storybook build
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: ./.depot/actions/setup-bun

      - name: Build Storybook
        if: hashFiles('packages/storybook/package.json') != ''
        run: bun --cwd packages/storybook build
