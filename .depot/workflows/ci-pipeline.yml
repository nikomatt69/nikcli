name: ci-pipeline

# Cursor Origin / Depot CI copy of the quality-gate pipeline.
# Publish, desktop, and Railway stay in .github/workflows (GitHub-only).

on:
  push:
    branches:
      - live-main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/live-main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: depot-ubuntu-24.04-4
    # Backstop for anything the per-step timeouts in ci-validate.ts cannot kill;
    # the run itself should finish well inside this.
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.depot/actions/setup-bun

      - name: Run validation
        id: validate
        shell: bash
        run: |
          set -o pipefail
          bun run script/ci-validate.ts 2>&1 | tee ci-validation-output.txt

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-validation-summary
          path: tmp/ci-validation-summary.md
          retention-days: 7
          if-no-files-found: ignore

  autofix:
    needs: validate
    if: >-
      needs.validate.result == 'failure' &&
      contains(fromJSON('["nikomatt69/nikcli","nikoemme/nikcli"]'), github.repository) &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check if commit should be skipped
        id: skip-check
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          ACTOR: ${{ github.actor }}
        run: |
          if printf '%s' "$COMMIT_MSG" | grep -qE '^\[nikcli autofix\]|^release: v|^chore: generate|\[skip ci\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping autofix: anti-loop pattern matched"
            exit 0
          fi
          if [ "$ACTOR" = "github-actions[bot]" ] || [ "$ACTOR" = "nikcli-ci[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping autofix: bot actor"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SST_GITHUB_TOKEN || github.token }}

      - name: Setup Bun
        if: steps.skip-check.outputs.skip != 'true'
        uses: ./.depot/actions/setup-bun

      - name: Setup Git identity
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          git config --global user.email "nikcli-ci@users.noreply.github.com"
          git config --global user.name "nikcli-ci[bot]"

      - name: Run autofix
        if: steps.skip-check.outputs.skip != 'true'
        id: autofix
        run: bun run script/ci-autofix.ts
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NIKCLI_AUTOFIX_MODEL: ${{ vars.NIKCLI_AUTOFIX_MODEL || 'minimax-coding-plan/MiniMax-M3' }}
          GITHUB_TOKEN: ${{ secrets.SST_GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN || github.token }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Push fix
        if: steps.skip-check.outputs.skip != 'true' && steps.autofix.outcome == 'success'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing to push to unsafe ref name"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix(ci): automated validation repair [nikcli autofix]"
            git push origin "HEAD:$REF_NAME"
          else
            echo "No changes to push"
          fi

  report-failure:
    needs: [validate, autofix]
    if: >-
      always() &&
      needs.validate.result == 'failure' &&
      contains(fromJSON('["nikomatt69/nikcli","nikoemme/nikcli"]'), github.repository)
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.depot/actions/setup-bun

      - name: Report failure
        run: bun run script/ci-report-failure.ts
        env:
          GITHUB_TOKEN: ${{ secrets.SST_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NIKCLI_CI_FAILURE_MENTION: ${{ vars.NIKCLI_CI_FAILURE_MENTION || '@nikomatt69' }}
          AUTOFIX_ATTEMPTED: ${{ needs.autofix.result }}
