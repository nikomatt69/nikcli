name: security

on:
  pull_request:
    branches: [live-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub's dependency-review-action is not available on Origin. Audit the
  # lockfile on every PR so Cursor Codebase still has a vulnerability gate.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.depot/actions/setup-bun

      - name: Audit dependencies
        run: bun audit --audit-level=high
