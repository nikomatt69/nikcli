<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NikCLI Remote</title>
    <style>
      :root {
        --bg: #09090b;
        --panel: #18181b;
        --border: #27272a;
        --text: #e4e4e7;
        --muted: #a1a1aa;
        --accent: #5eead4;
        --error: #f87171;
        --success: #34d399;
        --available-height: 100%;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        overscroll-behavior-y: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
        height: var(--available-height, 100dvh);
        position: relative;
      }

      /* Loading State */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 50;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #loading-text {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      /* Header */
      #header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 0px) 16px 0px 16px;
        height: calc(44px + env(safe-area-inset-top, 0px));
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        z-index: 10;
      }
      #header h1 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #header h1::before {
        content: "";
        display: block;
        width: 14px;
        height: 14px;
        background: var(--accent);
        mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 17l6-6-6-6M12 19h8" stroke-linecap="round" stroke-linejoin="round"/></svg>')
          center/contain no-repeat;
        -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 17l6-6-6-6M12 19h8" stroke-linecap="round" stroke-linejoin="round"/></svg>')
          center/contain no-repeat;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--error);
        box-shadow: 0 0 8px var(--error);
      }
      #status-dot.connected {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
      }
      #status-dot.connecting {
        background: #fbbf24;
        box-shadow: 0 0 8px #fbbf24;
        animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.8);
        }
      }

      /* Terminal Area */
      #terminal-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: var(--bg);
        transition: opacity 0.3s ease;
        min-height: 0;
        /* Mobile: account for safe area bottom (keyboard area on some devices) */
        height: calc(100% - env(safe-area-inset-bottom, 0px));
      }
      #terminal-container.hidden {
        opacity: 0;
      }
      #terminal {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: manipulation;
      }

      /* Mobile keyboard active state - resize terminal when virtual keyboard shows */
      body.keyboard-visible #terminal-container {
        height: calc(100% - env(safe-area-inset-bottom, 0px));
      }

      /* Desktop: no safe area adjustments */
      @media (min-width: 768px) {
        #terminal-container {
          height: 100%;
        }
      }

      /* Hidden input overlay for mobile keyboard capture (desktop only) */
      #hidden-input-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        z-index: 5;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: transparent;
        caret-color: transparent;
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        line-height: 1.5;
        padding: 0;
        margin: 0;
        pointer-events: auto;
        -webkit-appearance: none;
        appearance: none;
        touch-action: manipulation;
      }

      /* On mobile, disable pointer events on hidden overlay so mobile input bar works */
      @media (max-width: 767px) {
        #hidden-input-overlay {
          pointer-events: none;
        }
      }

      #hidden-input-overlay::placeholder,
      #hidden-input-overlay::-webkit-input-placeholder {
        color: transparent;
      }

      #hidden-input-overlay::-moz-placeholder {
        color: transparent;
      }

      /* Native Mobile Control Strip */
      #mobile-controls {
        display: flex;
        padding: 8px 12px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--border);
        gap: 6px;
        flex-shrink: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #mobile-controls::-webkit-scrollbar {
        display: none;
      }

      /* Explicit Mobile Input Field */
      #mobile-input-bar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        align-items: center;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        pointer-events: auto;
      }
      #mobile-input-bar input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        touch-action: manipulation;
        pointer-events: auto;
      }
      #mobile-input-bar input:focus {
        border-color: var(--accent);
      }
      #mobile-input-bar button {
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #mobile-input-bar button:active {
        opacity: 0.8;
      }

      /* Hide mobile input bar on desktop */
      @media (min-width: 768px) {
        #mobile-controls,
        #mobile-input-bar {
          display: none;
        }
      }

      /* Mobile-only: ensure terminal container leaves space for input bar */
      @media (max-width: 767px) {
        #terminal-container {
          /* Base padding for fixed input bar - account for safe-area-inset-bottom */
          padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
        }

        /* When keyboard is visible, reduce padding to allow terminal to use more space */
        body.keyboard-visible #terminal-container {
          padding-bottom: 20px;
        }
      }
      .m-key {
        flex-shrink: 0;
        min-width: 44px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: monospace;
        font-size: 13px;
        font-weight: 500;
        user-select: none;
        transition:
          background 0.1s,
          transform 0.1s;
      }
      .m-key:active {
        background: var(--border);
        transform: scale(0.95);
      }
      .m-key.special {
        color: var(--accent);
        border-color: rgba(94, 234, 212, 0.2);
        background: rgba(94, 234, 212, 0.05);
      }
      .m-key.special:active {
        background: rgba(94, 234, 212, 0.15);
      }

      @media (min-width: 768px) {
        #mobile-controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <h1>NikCLI</h1>
        <div id="status">
          <span id="status-dot" class="connecting"></span>
          <span id="status-text">Connecting</span>
        </div>
      </header>

      <div id="terminal-container" class="hidden">
        <canvas id="terminal"></canvas>
        <!-- Hidden input overlay for capturing mobile keyboard input -->
        <textarea
          id="hidden-input-overlay"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-hidden="true"
        ></textarea>
      </div>

      <!-- Native Mobile Control Strip -->
      <div id="mobile-controls">
        <div class="m-key special qkey" data-key="Esc">ESC</div>
        <div class="m-key qkey" data-key="Tab">TAB</div>
        <div class="m-key special qkey" data-key="Ctrl-C">^C</div>
        <div class="m-key special qkey" data-key="Ctrl-D">^D</div>
        <div class="m-key qkey" data-key="Ctrl-L">^L</div>
        <div class="m-key qkey" data-key="-">-</div>
        <div class="m-key qkey" data-key="/">/</div>
        <div class="m-key qkey" data-key="|">|</div>
        <div class="m-key special qkey" data-key="Enter">⏎</div>
      </div>

      <!-- Explicit Mobile Input Bar -->
      <div id="mobile-input-bar">
        <input
          type="search"
          id="visible-input"
          placeholder="Type command..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          autocapitalize="off"
          enterkeyhint="send"
          inputmode="text"
        />
        <button id="send-btn">Send</button>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">Waking up terminal...</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
