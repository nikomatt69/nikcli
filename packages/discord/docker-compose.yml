version: "3.8"

services:
  discord-bot:
    build:
      context: ../..
      dockerfile: packages/discord/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
