[package]
name = "nikcli-native-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust host for real native nikcli surfaces"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
