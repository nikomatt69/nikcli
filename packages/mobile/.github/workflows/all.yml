name: Build All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/mobile/**"
  pull_request:
    paths:
      - "packages/mobile/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run type checks first in parallel with other prep
  typecheck:
    name: TypeScript Check
    runs-on: macos-sequoia-15.4
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "npm"
          cache-dependency-path: packages/mobile/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: "1.3.12"

      - name: Install dependencies
        run: bun install
        working-directory: packages/mobile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/mobile

  # iOS build
  ios-build:
    name: Build iOS
    needs: typecheck
    runs-on: macos-sequoia-15.4
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "npm"
          cache-dependency-path: packages/mobile/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: "1.3.12"

      - name: Install dependencies
        run: bun install
        working-directory: packages/mobile

      - name: Install CocoaPods dependencies
        run: bunx pod-install
        working-directory: packages/mobile/ios

      - name: Build iOS (EAS)
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Run EAS Build
        run: |
          eas build --platform ios --profile preview --non-interactive
        working-directory: packages/mobile
        env:
          EAS_BUILD_TIMEOUT: 3600

  # Android build
  android-build:
    name: Build Android
    needs: typecheck
    runs-on: macos-sequoia-15.4
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "npm"
          cache-dependency-path: packages/mobile/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: "1.3.12"

      - name: Install dependencies
        run: bun install
        working-directory: packages/mobile

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android (EAS)
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Run EAS Build
        run: |
          eas build --platform android --profile preview --non-interactive
        working-directory: packages/mobile
        env:
          EAS_BUILD_TIMEOUT: 3600
