<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>nikcli Terminal</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --term-bg: #0d0d0d;
        --term-fg: #e6edf3;
        --term-color-0: #484f58;
        --term-color-1: #ff7b72;
        --term-color-2: #3fb950;
        --term-color-3: #d29922;
        --term-color-4: #58a6ff;
        --term-color-5: #bc8cff;
        --term-color-6: #39c5cf;
        --term-color-7: #b1bac4;
        --term-color-8: #6e7681;
        --term-color-9: #ffa198;
        --term-color-10: #56d364;
        --term-color-11: #e3b341;
        --term-color-12: #79c0ff;
        --term-color-13: #d2a8ff;
        --term-color-14: #56d4dd;
        --term-color-15: #f0f6fc;
        --term-cursor: #58a6ff;
        --term-font-size: 13px;
        --term-row-height: 17px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--term-bg);
      }

      body {
        position: relative;
        margin: 0;
        -webkit-user-select: text;
        user-select: text;
      }

      #terminal {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        font-family: "JetBrainsMono", "JetBrains Mono", "Menlo", "Monaco", "Courier New", monospace;
        font-size: var(--term-font-size);
      }

      .wterm {
        --term-font-family: "JetBrainsMono", "JetBrains Mono", "Menlo", "Monaco", "Courier New", monospace;
        --term-font-size: inherit;
        --term-line-height: 1.25;
        --term-row-height: inherit;
        position: relative;
        background: var(--term-bg);
        color: var(--term-fg);
        font-family: var(--term-font-family);
        font-size: var(--term-font-size);
        line-height: var(--term-line-height);
        outline: none;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
      }
      .wterm:focus,
      .wterm:focus-visible {
        outline: none;
      }
      #terminal.wterm {
        padding: 4px 8px;
        border-radius: 0;
        box-shadow: none;
        width: 100%;
        height: 100%;
      }
      .term-grid {
        display: block;
        white-space: pre;
        contain: layout paint style;
        will-change: contents;
      }
      .term-row {
        display: block;
        height: var(--term-row-height);
        line-height: var(--term-row-height);
        contain: layout style;
      }
      .term-row > span {
        display: inline-block;
        height: var(--term-row-height);
        vertical-align: top;
      }
      .term-block {
        width: 1ch;
        overflow: hidden;
      }
      .term-cursor {
        outline: 1px solid var(--term-cursor);
        outline-offset: -1px;
      }
      .wterm.focused .term-cursor {
        background: var(--term-cursor);
        color: var(--term-bg);
        outline: none;
      }
      .wterm.focused.cursor-blink .term-cursor {
        animation: cursor-blink 1s step-end infinite;
      }
      @keyframes cursor-blink {
        0%,
        100% {
          background: var(--term-cursor);
          color: var(--term-bg);
        }
        50% {
          background: transparent;
          color: inherit;
        }
      }
      .wterm.has-scrollback {
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .wterm ::selection {
        background: rgba(86, 156, 214, 0.35);
      }

      #status {
        position: fixed;
        top: 8px;
        right: 10px;
        font-family: system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 100px;
        pointer-events: none;
        transition: opacity 0.3s ease;
        opacity: 0;
        z-index: 50;
      }
      #status.connecting {
        background: rgba(210, 153, 34, 0.18);
        color: #d29922;
        opacity: 1;
      }
      #status.connected {
        background: rgba(63, 185, 80, 0.15);
        color: #3fb950;
        opacity: 1;
      }
      #status.error {
        background: rgba(255, 123, 114, 0.18);
        color: #ff7b72;
        opacity: 1;
      }
      #status.reconnecting {
        background: rgba(88, 166, 255, 0.15);
        color: #58a6ff;
        opacity: 1;
      }

      #error-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(13, 17, 23, 0.92);
        border: 1px solid rgba(255, 123, 114, 0.3);
        border-radius: 12px;
        padding: 24px 32px;
        text-align: center;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 100;
      }
      #error-overlay.visible {
        display: flex;
      }
      #error-overlay h3 {
        color: #ff7b72;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      #error-overlay p {
        color: rgba(230, 237, 243, 0.7);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        margin: 0;
        max-width: 280px;
        line-height: 1.4;
      }
      #error-overlay .url-display {
        color: rgba(88, 166, 255, 0.6);
        font-size: 10px;
        word-break: break-all;
        max-width: 260px;
      }
      #retry-btn {
        background: rgba(88, 166, 255, 0.15);
        border: 1px solid rgba(88, 166, 255, 0.4);
        color: #58a6ff;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="status" class="connecting">Connecting…</div>
    <div id="error-overlay">
      <h3>Connection Failed</h3>
      <p id="error-message">Unable to connect to terminal server</p>
      <p class="url-display" id="error-url"></p>
      <button id="retry-btn" onclick="manualRetry()">Retry Connection</button>
    </div>

    <!-- Offline wterm IIFE (WASM inlined). Injected by RN at load time. -->
    <script>
      __WTERM_BUNDLE__
    </script>
    <script>
      ;(function () {
        const WTerm = globalThis.WTermLib && globalThis.WTermLib.WTerm
        if (!WTerm) {
          document.getElementById("error-overlay").classList.add("visible")
          document.getElementById("error-message").textContent = "Terminal runtime failed to load"
          postRN({ type: "status", status: "error" })
          return
        }

        const cfg = window.__NIKCLI_PTY_CONFIG || {}
        let wsUrl = cfg.wsUrl || null
        let theme = cfg.theme || "dark"
        let fontSize = typeof cfg.fontSize === "number" ? cfg.fontSize : 13

        const LIGHT = {
          "--term-bg": "#ffffff",
          "--term-fg": "#24292f",
          "--term-color-0": "#57606a",
          "--term-color-1": "#cf222e",
          "--term-color-2": "#116329",
          "--term-color-3": "#4d2d00",
          "--term-color-4": "#0550ae",
          "--term-color-5": "#6639ba",
          "--term-color-6": "#1b7c83",
          "--term-color-7": "#8c959f",
          "--term-color-8": "#6e7781",
          "--term-color-9": "#a40e26",
          "--term-color-10": "#1a7f37",
          "--term-color-11": "#633c01",
          "--term-color-12": "#0969da",
          "--term-color-13": "#8250df",
          "--term-color-14": "#1b7c83",
          "--term-color-15": "#24292f",
          "--term-cursor": "#0550ae",
        }
        const DARK = {
          "--term-bg": "#0d0d0d",
          "--term-fg": "#e6edf3",
          "--term-color-0": "#484f58",
          "--term-color-1": "#ff7b72",
          "--term-color-2": "#3fb950",
          "--term-color-3": "#d29922",
          "--term-color-4": "#58a6ff",
          "--term-color-5": "#bc8cff",
          "--term-color-6": "#39c5cf",
          "--term-color-7": "#b1bac4",
          "--term-color-8": "#6e7681",
          "--term-color-9": "#ffa198",
          "--term-color-10": "#56d364",
          "--term-color-11": "#e3b341",
          "--term-color-12": "#79c0ff",
          "--term-color-13": "#d2a8ff",
          "--term-color-14": "#56d4dd",
          "--term-color-15": "#f0f6fc",
          "--term-cursor": "#58a6ff",
        }

        function applyTheme(next) {
          theme = next === "light" ? "light" : "dark"
          const palette = theme === "light" ? LIGHT : DARK
          const root = document.documentElement
          for (const [k, v] of Object.entries(palette)) root.style.setProperty(k, v)
          document.body.style.background = palette["--term-bg"]
        }

        function applyFontSize(px) {
          const size = Math.max(11, Math.min(16, Math.round(px)))
          fontSize = size
          const row = Math.ceil(size * 1.25)
          const root = document.documentElement
          root.style.setProperty("--term-font-size", size + "px")
          root.style.setProperty("--term-row-height", row + "px")
          el.style.fontSize = size + "px"
          if (wt) {
            // Force remount metrics via resize observer by nudging layout
            el.style.setProperty("--term-row-height", row + "px")
            if (wt.cols && wt.rows) postRN({ type: "resize", cols: wt.cols, rows: wt.rows })
          }
        }

        applyTheme(theme)
        applyFontSize(fontSize)

        const el = document.getElementById("terminal")
        const statusEl = document.getElementById("status")
        const errorOverlay = document.getElementById("error-overlay")
        const errorMessage = document.getElementById("error-message")
        const errorUrl = document.getElementById("error-url")

        function setStatus(state, text) {
          statusEl.className = state
          statusEl.textContent = text
        }

        function showError(message, url) {
          errorMessage.textContent = message
          // Never leak auth tokens from the WS URL in the overlay.
          let safe = ""
          if (url) {
            try {
              const u = new URL(url)
              u.searchParams.delete("token")
              safe = "URL: " + u.toString()
            } catch {
              safe = ""
            }
          }
          errorUrl.textContent = safe
          errorOverlay.classList.add("visible")
        }

        function hideError() {
          errorOverlay.classList.remove("visible")
        }

        let wt = null
        let ws = null
        let reconnectTimer = null
        let connectAttempts = 0
        let connectionTimeoutId = null
        let statusHideTimer = null
        let stopped = false
        let terminalFocusReported = null
        const FOCUS_IN = "\x1b[I"
        const FOCUS_OUT = "\x1b[O"
        const MAX_RETRIES = 5
        const RETRY_DELAY_MS = 2000

        function reportTerminalFocus(focused) {
          if (terminalFocusReported === focused) return
          terminalFocusReported = focused
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(focused ? FOCUS_IN : FOCUS_OUT)
          }
        }

        function mountFocusReporting() {
          const textarea = el.querySelector("textarea")
          if (!textarea || el.dataset.focusReady === "1") return
          el.dataset.focusReady = "1"

          textarea.addEventListener("focus", () => reportTerminalFocus(true))
          textarea.addEventListener("blur", () => {
            setTimeout(() => {
              const active = document.activeElement
              if (active === textarea || el.contains(active)) return
              reportTerminalFocus(false)
            }, 0)
          })

          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              reportTerminalFocus(false)
              return
            }
            if (document.activeElement === textarea || el.classList.contains("focused")) {
              reportTerminalFocus(true)
            }
          })
        }

        function focusTerminalSurface() {
          wt?.focus()
          reportTerminalFocus(true)
        }

        function blurTerminalSurface() {
          const textarea = el.querySelector("textarea")
          if (textarea && document.activeElement === textarea) textarea.blur()
          reportTerminalFocus(false)
        }

        async function initTerminal() {
          wt = new WTerm(el, { autoResize: true, cursorBlink: true })
          await wt.init()
          wt.onData = (data) => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(data)
          }
          wt.onTitle = (title) => postRN({ type: "title", title })
          wt.onResize = (cols, rows) => {
            postRN({ type: "resize", cols, rows })
          }
          mountFocusReporting()
          el.addEventListener("pointerdown", focusTerminalSurface, { passive: true })
          el.addEventListener("click", focusTerminalSurface)
          // Long-press selection: notify RN when selection changes
          document.addEventListener("selectionchange", () => {
            const sel = window.getSelection?.()?.toString?.() ?? ""
            if (sel.trim()) postRN({ type: "selection", text: sel })
          })
          mountViewportObserver()
          if (el.querySelector("textarea") === document.activeElement || el.classList.contains("focused")) {
            reportTerminalFocus(true)
          }
        }

        function mountViewportObserver() {
          if (!window.ResizeObserver) return
          const observer = new ResizeObserver(() => {
            if (wt?.cols && wt?.rows) {
              postRN({ type: "resize", cols: wt.cols, rows: wt.rows })
            }
          })
          observer.observe(el)
          if (document.body) observer.observe(document.body)
        }

        function postRN(payload) {
          try {
            if (window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage(JSON.stringify(payload))
            }
          } catch {}
        }

        function handleNativeMessage(evt) {
          try {
            if (!evt?.data || typeof evt.data !== "string") return
            const msg = JSON.parse(evt.data)
            if (!msg || typeof msg !== "object") return
            if (msg.type === "resize") {
              if (typeof msg.cols !== "number" || typeof msg.rows !== "number") return
              wt?.resize(msg.cols, msg.rows)
            } else if (msg.type === "write") {
              if (typeof msg.data !== "string") return
              wt?.write(msg.data)
            } else if (msg.type === "paste") {
              if (typeof msg.data !== "string") return
              if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg.data)
            } else if (msg.type === "input") {
              if (typeof msg.data !== "string") return
              focusTerminalSurface()
              if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg.data)
            } else if (msg.type === "focus") {
              focusTerminalSurface()
            } else if (msg.type === "blur") {
              blurTerminalSurface()
            } else if (msg.type === "reconnect") {
              if (typeof msg.wsUrl === "string" && msg.wsUrl) wsUrl = msg.wsUrl
              manualRetry()
            } else if (msg.type === "copy") {
              postRN({ type: "copy", text: collectTerminalText() })
            } else if (msg.type === "theme") {
              applyTheme(msg.theme === "light" ? "light" : "dark")
            } else if (msg.type === "fontSize") {
              if (typeof msg.size === "number") applyFontSize(msg.size)
            }
          } catch {}
        }

        window.addEventListener("message", handleNativeMessage)
        document.addEventListener("message", handleNativeMessage)

        function collectTerminalText() {
          const selection = window.getSelection?.()?.toString?.() ?? ""
          if (selection.trim()) return selection
          const rows = Array.from(document.querySelectorAll(".term-row:not(.term-scrollback-row)"))
          if (rows.length)
            return rows
              .map((row) => row.textContent ?? "")
              .join("\n")
              .trimEnd()
          return el?.textContent ?? ""
        }

        function clearLifecycleTimers() {
          clearTimeout(reconnectTimer)
          clearTimeout(connectionTimeoutId)
          clearTimeout(statusHideTimer)
          reconnectTimer = null
          connectionTimeoutId = null
          statusHideTimer = null
        }

        function closeSocket() {
          if (!ws) return
          ws.onopen = null
          ws.onmessage = null
          ws.onclose = null
          ws.onerror = null
          try {
            ws.close()
          } catch {}
          ws = null
        }

        function startConnectionTimeout(url) {
          clearTimeout(connectionTimeoutId)
          connectionTimeoutId = setTimeout(() => {
            if (statusEl.className !== "connected") {
              connectAttempts++
              setStatus("error", "Timeout")
              showError("Connection timed out. Server may be unavailable.", url)
              postRN({ type: "status", status: "error" })
              closeSocket()
              if (!stopped && connectAttempts <= MAX_RETRIES) {
                scheduleReconnect(url)
              }
            }
          }, 30000)
        }

        function stopTerminal() {
          stopped = true
          clearLifecycleTimers()
          closeSocket()
        }

        window.addEventListener("beforeunload", stopTerminal)
        window.addEventListener("pagehide", stopTerminal)

        function scheduleReconnect(url) {
          if (stopped) return
          const delay = Math.min(RETRY_DELAY_MS * Math.pow(1.5, connectAttempts), 30000)
          reconnectTimer = setTimeout(() => connect(url), delay)
        }

        function connect(url) {
          if (!url) {
            setStatus("error", "No server")
            showError("No PTY URL provided. Check server connection.", null)
            wt?.write("\r\n\x1b[31mNo PTY URL provided.\x1b[0m\r\n")
            postRN({ type: "status", status: "no_url" })
            return
          }

          clearTimeout(reconnectTimer)
          clearTimeout(connectionTimeoutId)
          closeSocket()

          hideError()
          setStatus("connecting", connectAttempts > 0 ? `Retrying… (${connectAttempts}/${MAX_RETRIES})` : "Connecting…")
          postRN({ type: "status", status: "connecting" })

          ws = new WebSocket(url)
          ws.binaryType = "arraybuffer"
          startConnectionTimeout(url)

          ws.onopen = () => {
            clearTimeout(connectionTimeoutId)
            connectAttempts = 0
            setStatus("connected", "Connected")
            postRN({ type: "status", status: "connected" })
            hideError()
            if (wt?.cols && wt?.rows) {
              postRN({ type: "resize", cols: wt.cols, rows: wt.rows })
            }
            terminalFocusReported = null
            if (el.classList.contains("focused") || el.querySelector("textarea") === document.activeElement) {
              reportTerminalFocus(true)
            }
            clearTimeout(statusHideTimer)
            statusHideTimer = setTimeout(() => {
              if (statusEl.className === "connected") statusEl.style.opacity = "0"
            }, 2000)
          }

          ws.onmessage = (e) => {
            const data = e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data
            wt?.write(data)
          }

          ws.onclose = () => {
            postRN({ type: "status", status: "disconnected" })
            if (stopped) return
            connectAttempts++
            if (connectAttempts <= MAX_RETRIES) {
              setStatus("reconnecting", "Reconnecting…")
              statusEl.style.opacity = "1"
              scheduleReconnect(url)
            } else {
              setStatus("error", "Failed")
              showError("Connection lost. Max retries reached.", url)
              postRN({ type: "status", status: "error" })
            }
          }

          ws.onerror = () => {
            wt?.write(`\r\n\x1b[31mWebSocket error.\x1b[0m\r\n`)
          }
        }

        window.manualRetry = function () {
          stopped = false
          connectAttempts = 0
          if (wsUrl) {
            connect(wsUrl)
          } else {
            showError("No server URL available", null)
          }
        }

        async function start() {
          try {
            await initTerminal()
            connect(wsUrl)
          } catch (error) {
            setStatus("error", "Init failed")
            showError(`Terminal init failed: ${error.message}`, wsUrl)
            postRN({ type: "status", status: "error" })
          }
        }

        start()
      })()
    </script>
  </body>
</html>
