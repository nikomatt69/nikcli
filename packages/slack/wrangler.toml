name = "nikcli-slack"
main = "src/worker.ts"
compatibility_date = "2025-01-25"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Secrets to set via wrangler secret put:
# - SLACK_BOT_TOKEN
# - SLACK_SIGNING_SECRET
# - OPENAI_API_KEY (optional, for voice transcription)
# - NIKCLI_URL (URL of your nikcli server, default: http://localhost:4000)
# - NIKCLI_API_KEY (optional, for authenticated nikcli server)
