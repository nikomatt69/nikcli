name: Deploy Slack Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-fly:
    runs-on: ubuntu-latest
    if: contains(github.event.repository.topics, 'fly')
    steps:
      - uses: actions/checkout@v4
      - uses: oven/bun-setup@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.3
        with:
          args: "deploy --app nikcli-slack-bot"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-railway:
    runs-on: ubuntu-latest
    if: contains(github.event.repository.topics, 'railway')
    steps:
      - uses: actions/checkout@v4
      - uses: oven/bun-setup@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Deploy to Railway
        uses: amondnet/railway-deployment@v2
        with:
          args: up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_NAME: ${{ secrets.RAILWAY_PROJECT_NAME }}
