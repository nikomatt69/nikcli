# Railway config for the Slack Socket Mode bot (full Claude Tag features).
# Point the slackbot-socket service's "Config File Path" at this file so it
# builds packages/slack/Dockerfile instead of the repo-root Dockerfile.serve.
# Build context stays the repo root (Root Directory = "/").

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/slack/Dockerfile"

[deploy]
# Socket Mode connects outbound to Slack — no inbound HTTP/healthcheck needed.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
