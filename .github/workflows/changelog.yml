name: changelog

# Keeps CHANGELOG.md and GitHub releases in sync from commits:
#   - on every commit pushed to live-main → refresh the "Unreleased" section of
#     CHANGELOG.md (via script/changelog.ts --write --raw) and commit it back
#   - when a release is published/created → write the generated notes into that
#     release body (via script/changelog.ts --release <tag> --raw)
on:
  push:
    branches:
      - live-main
  release:
    types: [published, created]
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Skip our own changelog commit (and generated/release commits) to avoid loops.
    if: >-
      github.repository == 'nikomatt69/nikcli' &&
      (github.event_name != 'push' ||
       (!startsWith(github.event.head_commit.message, 'chore: update changelog') &&
        !startsWith(github.event.head_commit.message, 'release: v') &&
        !startsWith(github.event.head_commit.message, 'chore: generate') &&
        !contains(github.event.head_commit.message, '[skip changelog]')))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SST_GITHUB_TOKEN }}

      - run: git fetch --force --tags

      - uses: ./.github/actions/setup-bun

      # --- On commit: refresh CHANGELOG.md and push it back ---
      - name: Update CHANGELOG.md
        if: github.event_name != 'release'
        run: ./script/changelog.ts --write --raw
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md
        if: github.event_name != 'release'
        run: |
          if [ -z "$(git status --porcelain CHANGELOG.md)" ]; then
            echo "No changelog changes"
            exit 0
          fi
          git config --local user.email "nikcli-ci@users.noreply.github.com"
          git config --local user.name "nikcli-ci[bot]"
          git add CHANGELOG.md
          # "chore: update" prefix is excluded by ci-pipeline's publish job, so
          # the changelog commit never triggers an extra minor release.
          git commit -m "chore: update changelog [skip changelog]"
          git push origin HEAD:${{ github.ref_name }} --no-verify

      # --- On release: write the generated notes into the release body ---
      - name: Write release notes
        if: github.event_name == 'release'
        run: ./script/changelog.ts --release "${{ github.event.release.tag_name }}" --raw
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
