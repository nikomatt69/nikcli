name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  label-size:
    runs-on: ubuntu-latest
    steps:
      - name: Apply PR size label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const total = (pr.additions || 0) + (pr.deletions || 0);

            const ALL_SIZE_LABELS = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const SIZE_COLORS = {
              'size/XS': '00b0d8',
              'size/S':  '00b894',
              'size/M':  'fdcb6e',
              'size/L':  'e17055',
              'size/XL': 'd63031',
            };
            const label =
              total <= 10  ? 'size/XS' :
              total <= 50  ? 'size/S'  :
              total <= 200 ? 'size/M'  :
              total <= 500 ? 'size/L'  : 'size/XL';

            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            // Ensure the label exists in the repo (idempotent)
            try {
              await github.rest.issues.createLabel({
                owner, repo,
                name: label,
                color: SIZE_COLORS[label],
                description: `PR touches ${total} lines`,
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = already exists, that's fine
            }

            // Remove stale size labels, add the current one
            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number,
            });
            const toRemove = existing
              .map(l => l.name)
              .filter(n => ALL_SIZE_LABELS.includes(n) && n !== label);

            await Promise.all([
              ...toRemove.map(name =>
                github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {})
              ),
              github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] }),
            ]);

            core.info(`PR #${issue_number}: ${total} lines changed → ${label}`);
