name: nikcli-site-deploy

on:
  push:
    branches:
      - live-main
      - production
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    if: github.repository == 'nikomatt69/nikcli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy nikcli site with SST
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/sst-deploy.log"

          if bun sst deploy --stage="${{ github.ref_name }}" 2>&1 | tee "$log"; then
            exit 0
          fi

          # SST persists a lock when an update is interrupted. GitHub's
          # concurrency group serializes deployments for this stage, so a lock
          # reported after this deployment starts is stale and can be removed.
          if ! grep -Fq "A concurrent update was detected" "$log"; then
            exit 1
          fi

          echo "::warning::Removing stale SST deployment lock and retrying"
          bun sst unlock --stage="${{ github.ref_name }}"
          bun sst deploy --stage="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
