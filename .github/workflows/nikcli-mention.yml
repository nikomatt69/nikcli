name: nikcli-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  nikcli:
    if: |
      contains(github.event.comment.body, ' /nc') ||
      startsWith(github.event.comment.body, '/nc') ||
      contains(github.event.comment.body, ' /nikcli') ||
      startsWith(github.event.comment.body, '/nikcli')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run nikcli
        uses: nikomatt69/nikcli/github@main
        env:
          NIKCLI_API_KEY: ${{ secrets.NIKCLI_API_KEY }}
          NIKCLI_PERMISSION: '{"bash": "deny"}'
        with:
          model: minimax-coding-plan/MiniMax-M2.7
