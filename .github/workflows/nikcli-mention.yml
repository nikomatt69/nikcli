name: nikcli-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  nikcli:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /nc ') ||
        startsWith(github.event.comment.body, '/nc ') ||
        github.event.comment.body == '/nc'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run nikcli
        run: bun github/index.ts
        env:
          MODEL: minimax-coding-plan/MiniMax-M3
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          NIKCLI_PERMISSION: '{"*": "allow"}'
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
