name: windows-compat

# Runtime parity check on real Windows hardware (windows-latest runner =
# Windows Server 2022, PowerShell 5.1 + pwsh 7). Runs on every PR + push to
# live-main, on a weekly schedule (catches Bun/Windows regressions), and on
# manual dispatch. Mirrors what packages/nikcli/script/windows-smoke.ps1 does
# locally on the maintainer's VMs.

on:
  push:
    branches:
      - live-main
    paths:
      - "packages/nikcli/**"
      - "packages/sdk/js/**"
      - "packages/util/**"
      - "install"
      - "install.ps1"
      - ".github/workflows/windows-compat.yml"
  pull_request:
    paths:
      - "packages/nikcli/**"
      - "packages/sdk/js/**"
      - "packages/util/**"
      - "install"
      - "install.ps1"
      - ".github/workflows/windows-compat.yml"
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: windows-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/live-main' }}

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-windows-2025]
        shell: [pwsh, cmd]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/nikcli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Environment
        shell: pwsh
        run: |
          Write-Host "OS:    $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Arch:  $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Shell matrix value: ${{ matrix.shell }}"
          Write-Host "bun:   $(& bun --version)"
          Write-Host "pwsh:  $($PSVersionTable.PSVersion)"

      # --- typecheck + unit suites that exercise the Windows fixes ---

      - name: typecheck
        shell: pwsh
        run: bun run typecheck

      - name: tests — double-ESC interrupt state machine
        shell: pwsh
        run: bun test test/tui/util/double-esc.test.ts

      - name: tests — session (retry jitter, prompt resolution)
        shell: pwsh
        run: bun test test/session

      - name: tests — config + worktree (Effect TaggedError tags)
        shell: pwsh
        run: bun test test/config test/worktree

      - name: tests — util (filesystem, lock, wildcard)
        shell: pwsh
        run: bun test test/util

      # --- Windows-specific runtime invariants ---

      - name: invariant — pathToFileURL roundtrip with drive letters
        shell: pwsh
        run: |
          $script = @'
          import { pathToFileURL, fileURLToPath } from "node:url"
          const win = "C:\\Users\\test\\foo.txt"
          const url = pathToFileURL(win).href
          if (!url.startsWith("file:///C:/")) { console.error("bad url:", url); process.exit(1) }
          const back = fileURLToPath(url)
          if (back.toLowerCase() !== win.toLowerCase()) { console.error("roundtrip mismatch:", back); process.exit(1) }
          console.log("file URL roundtrip ok:", url, "<->", back)
          '@
          $tmp = "$env:RUNNER_TEMP\file-url-check.mjs"
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          & bun $tmp

      - name: invariant — Global.Path resolves to Windows AppData
        shell: pwsh
        run: |
          $script = @'
          import { Global } from "@/global"
          const data = Global.Path.data
          const cfg = Global.Path.config
          console.log("data:", data, "config:", cfg)
          const drive = /^[A-Za-z]:[\\/]/
          if (!drive.test(data)) { console.error("data is not a Windows drive:", data); process.exit(1) }
          if (data.includes("/.local/share/")) { console.error("XDG POSIX fallback leaked:", data); process.exit(1) }
          console.log("Global.Path Windows fallback ok")
          '@
          # Inside packages/nikcli, not RUNNER_TEMP: `@/` is a tsconfig paths
          # alias, and bun resolves it from the nearest tsconfig to the file.
          $tmp = "global-path-check.ts"
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          try { & bun --conditions=browser $tmp } finally { Remove-Item $tmp -Force -ErrorAction SilentlyContinue }
          exit $LASTEXITCODE

      - name: invariant — Shell.preferred / Shell.select on Windows
        shell: pwsh
        run: |
          $script = @'
          import { Shell } from "@/shell/shell"
          const pref = Shell.preferred().toLowerCase()
          console.log("preferred:", pref)
          const ok = pref.endsWith("cmd.exe") || pref.endsWith("powershell.exe") || pref.endsWith("pwsh.exe") || pref.endsWith("bash.exe")
          if (!ok) { console.error("unexpected shell:", pref); process.exit(1) }
          const psSel = Shell.select("$env:PATH | ForEach-Object { $_ }")
          console.log("PowerShell-marker selected:", psSel)
          console.log("Shell helpers ok")
          '@
          $tmp = "shell-check.ts"
          Set-Content -Path $tmp -Value $script -Encoding UTF8
          try { & bun --conditions=browser $tmp } finally { Remove-Item $tmp -Force -ErrorAction SilentlyContinue }
          exit $LASTEXITCODE

      # --- Build + execute the native Windows binary ---

      - name: Build single-target Windows binary
        shell: pwsh
        run: bun run script/build.ts --single

      - name: Built nikcli.exe --help exits 0 and prints 'nikcli'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $bin = ".\dist\nikcli-ai-windows-$arch\bin\nikcli.exe"
          if (-not (Test-Path $bin)) { throw "missing binary: $bin" }
          $size = [math]::Round((Get-Item $bin).Length / 1MB, 1)
          Write-Host "built: $bin ($size MB)"
          $out = & $bin --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE`n$out" }
          # Join first: against an array, -notmatch is a filter, and `if` on the
          # resulting non-empty array is true whenever ANY single line lacks
          # "nikcli" — which is every run, however good the output is.
          $text = $out | Out-String
          if ($text -notmatch "nikcli") { throw "--help output missing 'nikcli'`n$text" }
          Write-Host "nikcli.exe --help ok ($($text.Length) chars)"

      - name: Built nikcli.exe --version exits 0
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $bin = ".\dist\nikcli-ai-windows-$arch\bin\nikcli.exe"
          $out = & $bin --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE`n$out" }
          Write-Host "version: $out"

      # --version / --help never import @opentui/core, which is how the 1.226.0
      # release shipped a binary that crashed on every TUI launch. This boots the
      # real TUI in a ConPTY and asserts it paints.
      - name: Built nikcli.exe boots the TUI
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          bun run script/tui-smoke.ts ".\dist\nikcli-ai-windows-$arch\bin\nikcli.exe"
          if ($LASTEXITCODE -ne 0) { throw "TUI smoke exited $LASTEXITCODE" }

      # --- installers: the npm wrapper and the PowerShell installer ---

      - name: npm path — postinstall + wrapper resolve nikcli.exe
        shell: pwsh
        run: |
          # Rebuild the published layout around the binary we just compiled:
          # wrapper package + one per-platform optional dependency.
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
          $built = ".\dist\nikcli-ai-windows-$arch\bin\nikcli.exe"
          if (-not (Test-Path $built)) { throw "missing binary: $built" }

          $pkg = Join-Path $env:RUNNER_TEMP "npm-layout"
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          $dep = Join-Path $pkg "node_modules\nikcli-ai-windows-$arch\bin"
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg "bin"), $dep | Out-Null
          Copy-Item $built (Join-Path $dep "nikcli.exe")
          Copy-Item ".\bin\nikcli" (Join-Path $pkg "bin\nikcli")
          Copy-Item ".\script\postinstall.mjs" (Join-Path $pkg "postinstall.mjs")
          # postinstall.mjs and the wrapper both locate the per-platform package
          # with `require.resolve("<name>/package.json")`, so the stand-in needs a
          # manifest — without one the resolve throws, the npm fallback tries to
          # fetch a version that does not exist, and nothing is materialized.
          @{ name = "nikcli-ai-windows-$arch"; version = "0.0.0" } | ConvertTo-Json |
            Set-Content (Join-Path (Split-Path $dep -Parent) "package.json") -Encoding UTF8
          @{
            name = "nikcli-ai"; version = "0.0.0"
            bin = @{ nikcli = "./bin/nikcli" }
            optionalDependencies = @{ "nikcli-ai-windows-$arch" = "0.0.0" }
          } | ConvertTo-Json | Set-Content (Join-Path $pkg "package.json") -Encoding UTF8

          node (Join-Path $pkg "postinstall.mjs")
          if (-not (Test-Path (Join-Path $pkg "bin\nikcli.exe"))) { throw "postinstall did not materialize bin\nikcli.exe" }

          $out = & node (Join-Path $pkg "bin\nikcli") --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "wrapper failed after postinstall: $out" }
          Write-Host "wrapper (materialized): $out"

          # Same wrapper with postinstall skipped (pnpm / --ignore-scripts): it has
          # to fall back to resolving the optional dependency at runtime.
          Remove-Item (Join-Path $pkg "bin\nikcli.exe") -Force
          $out = & node (Join-Path $pkg "bin\nikcli") --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "wrapper failed without postinstall: $out" }
          Write-Host "wrapper (runtime resolve): $out"

      - name: install.ps1 — parses, runs through iex, installs a working nikcli.exe
        # One leg is enough: this downloads a release archive.
        if: matrix.shell == 'pwsh'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw "install.ps1 parse errors:`n$($errors | Out-String)" }
          Write-Host "install.ps1 parses clean"

          $dir = Join-Path $env:RUNNER_TEMP "nikcli-ps1-install"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $env:NIKCLI_INSTALL_DIR = $dir
          $env:NIKCLI_NO_PATH = "1"
          # `irm ... | iex` is how users actually run it, so exercise that shape.
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          $exe = Join-Path $dir "nikcli.exe"
          if (-not (Test-Path $exe)) { throw "install.ps1 did not produce $exe" }
          $out = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "installed nikcli.exe --version exited $LASTEXITCODE`n$out" }
          Write-Host "install.ps1 installed nikcli $out"

      # `nikcli upgrade` replaces the binary it is running from, and Windows
      # locks that image against writes — the plain copy can never succeed. The
      # installer stages the new binary and hands the swap to a detached process
      # that waits for NIKCLI_UPGRADE_PID to exit.
      - name: install.ps1 — defers the swap when the target exe is locked
        if: matrix.shell == 'pwsh'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "nikcli-ps1-upgrade"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "nikcli.exe"
          # A placeholder stands in for the running binary: --version fails on it,
          # so the installer treats it as replaceable and reaches the copy.
          Set-Content -Path $exe -Value "placeholder" -Encoding ASCII

          # Stands in for the nikcli process being upgraded: the swap must wait
          # for it, and only this handle makes the copy fail the way a running
          # image does.
          $running = Start-Process powershell -PassThru -WindowStyle Hidden `
            -ArgumentList "-NoProfile", "-NonInteractive", "-Command", "Start-Sleep -Seconds 120"
          $lock = [IO.File]::Open($exe, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
          try {
            $env:NIKCLI_INSTALL_DIR = $dir
            $env:NIKCLI_NO_PATH = "1"
            $env:NIKCLI_UPGRADE_PID = $running.Id
            Get-Content .\install.ps1 -Raw | Invoke-Expression

            $staged = @(Get-ChildItem -Path $dir -Filter "nikcli.update.*.exe" -File)
            if ($staged.Count -ne 1) { throw "expected one staged update, found $($staged.Count)" }
            Write-Host "staged: $($staged[0].Name)"
            if ((Get-Content $exe -Raw).Trim() -ne "placeholder") { throw "locked exe was overwritten in place" }
          } finally {
            $lock.Dispose()
            $env:NIKCLI_UPGRADE_PID = $null
          }

          Stop-Process -Id $running.Id -Force
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and @(Get-ChildItem -Path $dir -Filter "nikcli.update.*.exe" -File).Count -gt 0) {
            Start-Sleep -Milliseconds 250
          }
          if (@(Get-ChildItem -Path $dir -Filter "nikcli.update.*.exe" -File).Count -gt 0) {
            throw "staged update was never swapped in"
          }
          $out = & $exe --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "swapped nikcli.exe --version exited $LASTEXITCODE`n$out" }
          Write-Host "deferred upgrade produced nikcli $out"

      # --- cmd.exe leg: same binary, classic shell, no PowerShell ---

      - name: Re-run binary smoke from cmd.exe
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          set ARCH=x64
          if "%PROCESSOR_ARCHITECTURE%"=="ARM64" set ARCH=arm64
          dist\nikcli-ai-windows-%ARCH%\bin\nikcli.exe --help > nul
          if errorlevel 1 (echo --help failed under cmd.exe & exit /b 1)
          dist\nikcli-ai-windows-%ARCH%\bin\nikcli.exe --version
          if errorlevel 1 (echo --version failed under cmd.exe & exit /b 1)
          echo cmd.exe execution ok

      - name: Upload binary on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nikcli-windows-${{ matrix.shell }}-failed
          path: packages/nikcli/dist/nikcli-ai-windows-*/bin/nikcli.exe
          if-no-files-found: ignore
          retention-days: 7
