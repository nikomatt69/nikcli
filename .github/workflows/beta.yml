name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          nikcli-app-id: ${{ vars.NIKCLI_APP_ID }}
          nikcli-app-secret: ${{ secrets.NIKCLI_APP_SECRET }}

      - name: Install nikcli
        run: bun i -g nikcli@latest || curl -fsSL https://nikcli.store/install | bash || true

      - name: Sync beta branch
        if: hashFiles('script/beta.ts') != ''
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          NIKCLI_API_KEY: ${{ secrets.NIKCLI_API_KEY }}
        run: bun script/beta.ts
