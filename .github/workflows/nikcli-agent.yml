name: NikCLI Agent

on:
  repository_dispatch:
    types: [slack_command]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Command for nikcli to execute'
        required: true
        type: string
      channel:
        description: 'Slack channel ID to reply to'
        required: false
        type: string
      thread_ts:
        description: 'Slack thread TS to reply to'
        required: false
        type: string

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run NikCLI Headless
        env:
          NIKCLI_MODEL: minimax-coding-plan/MiniMax-M2.5
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
          SLACK_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel }}
          SLACK_THREAD_TS: ${{ github.event.inputs.thread_ts || github.event.client_payload.thread_ts }}
        run: |
          echo "Received command: $PROMPT"
          # Here we would run the headless version of nikcli
          # Currently nikcli is highly interactive. We need a wrapper script 
          # that runs it autonomously and posts the final result back to Slack.
          
          # Placeholder for the actual autonomous execution:
          bun run scripts/run-headless.ts "$PROMPT" "$SLACK_CHANNEL" "$SLACK_THREAD_TS"
