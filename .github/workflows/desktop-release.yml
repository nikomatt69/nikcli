name: desktop-release

# Builds the Tauri desktop apps (Nikcli) for every platform with `bun run tauri
# build` and uploads the installers to the GitHub release — mirroring the way the
# CLI binaries are attached. This workflow is separate from ci-pipeline but is
# triggered by it (as a reusable workflow) once a release has been published.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach desktop artifacts to (e.g. v1.106.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach desktop artifacts to (e.g. v1.106.0)"
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'nikomatt69/nikcli'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            rpm

      - uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # `bun run tauri build` runs the desktop "tauri" script; its beforeBuildCommand
      # prepares the per-target nikcli sidecar and builds the frontend automatically.
      - name: Build desktop app
        working-directory: packages/desktop
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          # Optional code-signing / notarization — used only if the secrets exist.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # Tauri updater signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundles
        id: collect
        shell: bash
        run: |
          BUNDLE="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p artifacts
          if [ -d "$BUNDLE" ]; then
            find "$BUNDLE" -type f \( \
              -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \
              -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" \
              -o -name "*.sig" \
              \) -exec cp {} artifacts/ \;
          fi
          ls -la artifacts || true
          count=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: steps.collect.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" artifacts/* --clobber --repo nikomatt69/nikcli
