name: generate

on:
  push:
    branches:
      - live-main
  workflow_dispatch:

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        if: vars.NIKCLI_APP_ID != ''
        uses: ./.github/actions/setup-git-committer
        with:
          nikcli-app-id: ${{ vars.NIKCLI_APP_ID }}
          nikcli-app-secret: ${{ secrets.NIKCLI_APP_SECRET }}

      - name: Generate
        run: ./script/generate.ts

      - name: Verify live-main generated output
        if: github.ref_name == 'live-main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Generated SDK output differs on live-main; publish workflow will include it in the release commit."
          fi

      - name: Commit and push
        if: github.ref_name != 'live-main'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          if [ "${{ steps.committer.outcome }}" != "success" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
          fi
          git add -A
          git commit -m "chore: generate"
          git push origin HEAD:${{ github.ref_name }} --no-verify
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
          #   echo ""
          #   echo "============================================"
          #   echo "Failed to push generated code."
          #   echo "Please run locally and push:"
          #   echo ""
          #   echo "  ./script/generate.ts"
          #   echo "  git add -A && git commit -m \"chore: generate\" && git push"
          #   echo ""
          #   echo "============================================"
          #   exit 1
          # fi
